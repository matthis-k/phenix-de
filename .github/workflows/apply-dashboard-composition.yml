name: Apply dashboard composition changes

on:
  push:
    branches:
      - feat/dashboard-composition-audit-fixes
    paths:
      - .github/workflows/apply-dashboard-composition.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dashboard-composition-audit-fixes
          fetch-depth: 0
      - name: Apply source transformation
        run: python3 .github/scripts/apply-dashboard-composition.py
      - name: Commit transformed sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add configs docs
          git diff --cached --check
          git commit -m "refactor(ui): apply dashboard composition and audit fixes"
          git push origin HEAD:feat/dashboard-composition-audit-fixes
