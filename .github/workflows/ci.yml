name: Format migration

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Format migration file
        run: |
          set -euo pipefail
          nix shell nixpkgs#nixfmt --command nixfmt modules/package.nix
          if git diff --quiet -- modules/package.nix; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/package.nix
          git commit -m 'style: format desktop package [skip ci]'
          git push origin HEAD:${{ github.head_ref }}
